<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>学习预算与单位检查</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Micraow/Inform-UI@6797f7f7755f483db6c3be3831aa03433b7c4696/cdn/iui.css" integrity="sha384-LHkRYrW+gjyqnUp86CgtLDWvOrTbN3oncoJv80YTzEHuGnfZadFBbc4HgBPMNQz2" crossorigin="anonymous">
</head>
<body class="iui-page" data-theme="auto" style="margin:0">
  <main id="iui">正在加载界面…</main>
  <noscript>请启用 JavaScript 以查看这个交互文档。</noscript>
  <script id="iui-spec" type="application/json">
{
  "version": "iui/1",
  "title": "学习预算与单位检查",
  "description": "原创合成教学样例：本地预算试算、真实数值坐标、缺测检查、单位与汇率换算、自测。",
  "theme": "auto",
  "state": {
    "hoursPerWeek": 6,
    "weeks": 4,
    "hourlyCost": 80,
    "budget": 2000,
    "recordsReady": true
  },
  "computed": {
    "totalHours": {
      "op": "mul",
      "args": [
        {
          "$": "hoursPerWeek"
        },
        {
          "$": "weeks"
        }
      ]
    },
    "totalCost": {
      "op": "mul",
      "args": [
        {
          "$": "totalHours"
        },
        {
          "$": "hourlyCost"
        }
      ]
    },
    "budgetLeft": {
      "op": "max",
      "args": [
        {
          "op": "sub",
          "args": [
            {
              "$": "budget"
            },
            {
              "$": "totalCost"
            }
          ]
        },
        0
      ]
    },
    "budgetOver": {
      "op": "max",
      "args": [
        {
          "op": "sub",
          "args": [
            {
              "$": "totalCost"
            },
            {
              "$": "budget"
            }
          ]
        },
        0
      ]
    },
    "budgetStatus": {
      "op": "if",
      "args": [
        {
          "op": "gt",
          "args": [
            {
              "$": "totalCost"
            },
            {
              "$": "budget"
            }
          ]
        },
        "当前方案超出假设预算，请观察超支金额。",
        "当前方案在假设预算内。"
      ]
    },
    "recordStatus": {
      "op": "if",
      "args": [
        {
          "$": "recordsReady"
        },
        "记录可用：第 0 周的 0 小时是已知零值，第 4 周缺测。",
        "记录不可用：所有观测均为缺测，图表应显示空状态。"
      ]
    },
    "record0": {
      "op": "if",
      "args": [
        {
          "$": "recordsReady"
        },
        0,
        null
      ]
    },
    "record1": {
      "op": "if",
      "args": [
        {
          "$": "recordsReady"
        },
        5,
        null
      ]
    },
    "record12": {
      "op": "if",
      "args": [
        {
          "$": "recordsReady"
        },
        65,
        null
      ]
    }
  },
  "body": [
    {
      "type": "title",
      "level": 1,
      "value": "学习预算与单位检查"
    },
    {
      "type": "text",
      "value": "先算一个学习方案的时间与费用，再检查图里的零值、缺测和换算基准。下面所有金额、学习记录与汇率均为原创合成教学样例。"
    },
    {
      "type": "caption",
      "value": "来源：本页作者构造的合成教学数据。样例快照时间：2026-10-09 04:00 UTC（2026-10-09T04:00:00Z）。没有访问个人账本、课程账户或真实金融数据。"
    },
    {
      "type": "callout",
      "tone": "info",
      "value": "控件仅在此页面本地工作。预算输入不会发送或保存；汇率是固定合成快照，不会随时间更新。页面样式和运行库仍需联网加载。"
    },
    {
      "type": "section",
      "heading": "1. 用假设值试算学习预算",
      "children": [
        {
          "type": "text",
          "value": "默认方案：每周 6 小时，持续 4 周，每小时 80 CNY，预算 2,000 CNY。这里只计算按小时计费的课费，不含税费、教材或汇兑费用。"
        },
        {
          "type": "form",
          "id": "study_budget",
          "label": "调整合成学习方案",
          "submitLabel": "本地检查方案",
          "cancelLabel": "恢复本表单初值",
          "successMessage": "本地字段检查通过；没有发送或保存。",
          "children": [
            {
              "type": "input",
              "kind": "number",
              "label": "每周学习时长（小时）",
              "bind": "hoursPerWeek",
              "min": 0,
              "max": 20,
              "step": 0.5,
              "required": true
            },
            {
              "type": "input",
              "kind": "number",
              "label": "持续周数（周）",
              "bind": "weeks",
              "min": 1,
              "max": 12,
              "step": 1,
              "required": true
            },
            {
              "type": "input",
              "kind": "number",
              "label": "每小时费用（CNY/小时）",
              "bind": "hourlyCost",
              "min": 0,
              "max": 300,
              "step": 10,
              "required": true
            },
            {
              "type": "input",
              "kind": "number",
              "label": "假设预算（CNY）",
              "bind": "budget",
              "min": 0,
              "max": 20000,
              "step": 100,
              "required": true
            }
          ]
        },
        {
          "type": "caption",
          "value": "输入有效数字后，下方按当前有效值更新。清空或输入不完整数字时，指标仍显示最后有效值；请查看字段错误并完成本地检查。"
        },
        {
          "type": "math",
          "latex": "H=h\\times w,\\qquad C=H\\times p",
          "block": true
        },
        {
          "type": "text",
          "value": "h 是每周小时数，w 是周数，H 是总小时数，p 是每小时费用，C 是总课费。小时乘以 CNY/小时，结果单位才是 CNY。"
        },
        {
          "type": "metric-grid",
          "columns": 2,
          "children": [
            {
              "type": "metric",
              "label": "计划总学习时长",
              "value": {
                "$": "totalHours"
              },
              "unit": "小时",
              "precision": 1
            },
            {
              "type": "metric",
              "label": "预计总课费",
              "value": {
                "$": "totalCost"
              },
              "unit": "CNY",
              "precision": 2
            },
            {
              "type": "metric",
              "label": "预算剩余",
              "value": {
                "$": "budgetLeft"
              },
              "unit": "CNY",
              "precision": 2
            },
            {
              "type": "metric",
              "label": "预算超支",
              "value": {
                "$": "budgetOver"
              },
              "unit": "CNY",
              "precision": 2
            }
          ]
        },
        {
          "type": "text",
          "value": {
            "$": "budgetStatus"
          }
        },
        {
          "type": "button",
          "label": "试试免费课程：单价设为 0",
          "action": {
            "kind": "set",
            "bind": "hourlyCost",
            "value": 0
          }
        },
        {
          "type": "caption",
          "value": "免费课程的费用 0 是有效数值，不是价格缺测。时间投入仍由学习时长决定。"
        }
      ]
    },
    {
      "type": "section",
      "heading": "2. 看清数值坐标与缺测状态",
      "children": [
        {
          "type": "text",
          "value": "这组独立合成记录只用于学习读图，不代表上方方案的实际执行。横轴为开始后的周数：0、1、4、12 按真实数值距离排布。"
        },
        {
          "type": "toggle",
          "label": "显示合成记录（关闭查看空状态）",
          "bind": "recordsReady"
        },
        {
          "type": "text",
          "value": {
            "$": "recordStatus"
          }
        },
        {
          "type": "figure",
          "caption": "合成记录快照：2026-10-09 04:00 UTC。第 4 周未记录，保留 null；不能补 0，也不能把缺测两侧连成一条连续观测线。",
          "children": [
            {
              "type": "chart",
              "kind": "line",
              "title": "累计学习时长：非等距采样",
              "xKey": "week",
              "xScale": "linear",
              "xLabel": "开始后的周数（周）",
              "unit": "小时",
              "yMin": 0,
              "data": [
                {
                  "week": 0,
                  "hours": {
                    "$": "record0"
                  }
                },
                {
                  "week": 1,
                  "hours": {
                    "$": "record1"
                  }
                },
                {
                  "week": 4,
                  "hours": null
                },
                {
                  "week": 12,
                  "hours": {
                    "$": "record12"
                  }
                }
              ],
              "series": [
                {
                  "key": "hours",
                  "label": "合成累计记录",
                  "color": "blue"
                }
              ],
              "note": "0 小时表示已知没有累计学习；null 表示未知。关闭记录开关时，全部 Y 为 null，进入空状态。"
            }
          ]
        },
        {
          "type": "table",
          "columns": [
            "开始后的周数（周）",
            "累计学习时长（小时）"
          ],
          "rows": [
            [
              0,
              {
                "$": "record0"
              }
            ],
            [
              1,
              {
                "$": "record1"
              }
            ],
            [
              4,
              null
            ],
            [
              12,
              {
                "$": "record12"
              }
            ]
          ],
          "caption": "相同数据的精确值；缺测单元格保留 null。"
        },
        {
          "type": "button",
          "label": "模拟所有记录缺测",
          "action": {
            "kind": "set",
            "bind": "recordsReady",
            "value": false
          }
        },
        {
          "type": "button",
          "label": "恢复合成记录",
          "action": {
            "kind": "set",
            "bind": "recordsReady",
            "value": true
          }
        }
      ]
    },
    {
      "type": "section",
      "heading": "3. 检查单位与汇率基准",
      "children": [
        {
          "type": "text",
          "value": "一个 90 分钟的学习单元等于 1.5 小时。转换器可单独改数值和单位，不会自动修改上方预算输入。"
        },
        {
          "type": "unit-converter",
          "title": "学习时长：分钟与小时",
          "category": "time",
          "amount": 90,
          "from": "min",
          "to": "h",
          "precision": 8
        },
        {
          "type": "text",
          "value": "资料容量也要检查单位：1 MiB = 1.048576 MB。MiB 按二进制计数，MB 按十进制计数。"
        },
        {
          "type": "unit-converter",
          "title": "资料容量：MiB 与 MB",
          "category": "data",
          "amount": 1,
          "from": "MiB",
          "to": "MB",
          "precision": 8
        },
        {
          "type": "text",
          "value": "下面的合成汇率以 USD 为基准：1 USD = 7.2 CNY = 0.9 EUR；GBP 缺测。360 CNY 按该快照换算为 50 USD。换算结果不含价差或手续费，不能用于实际付款。"
        },
        {
          "type": "currency-converter",
          "title": "课程金额换算：固定合成汇率",
          "amount": 360,
          "base": "USD",
          "from": "CNY",
          "to": "USD",
          "precision": 8,
          "source": {
            "label": "学习预算示例：作者原创合成汇率",
            "synthetic": true
          },
          "asOf": "2026-10-09T04:00:00Z",
          "rates": [
            {
              "currency": "USD",
              "rate": 1
            },
            {
              "currency": "CNY",
              "rate": 7.2
            },
            {
              "currency": "EUR",
              "rate": 0.9
            },
            {
              "currency": "GBP",
              "rate": null
            }
          ]
        },
        {
          "type": "caption",
          "value": "试验：将目标币种选为 GBP，观察缺少汇率的状态；再切回 USD。金额 0 是有效输入，汇率 0 则不是合法报价，缺失汇率必须保留 null。"
        },
        {
          "type": "math",
          "latex": "A_{\\mathrm{to}}=A_{\\mathrm{from}}\\times\\frac{r_{\\mathrm{to}}}{r_{\\mathrm{from}}}",
          "block": true
        },
        {
          "type": "text",
          "value": "这里 r 表示每 1 USD 对应的目标币种单位数。缺少任一所需汇率时，无法计算交叉换算。"
        }
      ]
    },
    {
      "type": "section",
      "heading": "4. 先自己判断，再看解释",
      "children": [
        {
          "type": "quiz",
          "id": "budget_units_quiz",
          "title": "学习预算与单位：三题自测",
          "description": "原创客观题。选答后本地确认，再查看解释；答案已在页面中，成绩不保存。",
          "questions": [
            {
              "id": "minutes",
              "kind": "single",
              "prompt": "90 分钟按每小时 80 CNY 计费，费用是多少？",
              "choices": [
                {
                  "id": "a",
                  "label": "72 CNY"
                },
                {
                  "id": "b",
                  "label": "120 CNY"
                },
                {
                  "id": "c",
                  "label": "7,200 CNY"
                }
              ],
              "correct": [
                "b"
              ],
              "explanation": "先把 90 分钟除以 60，得到 1.5 小时，再乘 80 CNY/小时，得到 120 CNY。",
              "points": 1
            },
            {
              "id": "missing",
              "kind": "multiple",
              "prompt": "关于零值和缺测，哪些说法正确？",
              "choices": [
                {
                  "id": "a",
                  "label": "已确认免费课程的课费可以为 0。"
                },
                {
                  "id": "b",
                  "label": "GBP 汇率缺测时可以填 0，继续换算。"
                },
                {
                  "id": "c",
                  "label": "累计学习时长缺测应保留 null。"
                }
              ],
              "correct": [
                "a",
                "c"
              ],
              "explanation": "已知零值是信息；缺测是未知。汇率必须是正数或 null，零汇率不能替代缺测。",
              "points": 2
            },
            {
              "id": "axis",
              "kind": "single",
              "prompt": "横轴用周数 0、1、4、12 表示真实经过的时长时，应使用什么坐标？",
              "choices": [
                {
                  "id": "a",
                  "label": "等距 category 坐标"
                },
                {
                  "id": "b",
                  "label": "linear 数值坐标"
                }
              ],
              "correct": [
                "b"
              ],
              "explanation": "linear 让 0 到 1、1 到 4、4 到 12 的间隔分别对应 1、3、8 周，保留真实数值距离。",
              "points": 1
            }
          ]
        },
        {
          "type": "flashcards",
          "id": "budget_units_cards",
          "title": "两张换算回忆卡",
          "description": "先回忆，再翻面自评；标记只用于本轮。",
          "cards": [
            {
              "id": "cost_units",
              "front": "为什么 90 分钟不能直接乘以 80 CNY/小时？",
              "back": "时间单位不一致。先用 90 ÷ 60 = 1.5 小时，再乘单价。",
              "hint": "让分钟与小时先统一。"
            },
            {
              "id": "rate_direction",
              "front": "以 USD 为基准，CNY 汇率为 7.2，360 CNY 换 USD 应乘还是除？",
              "back": "除以 7.2，得到 50 USD。每 1 USD 对应 7.2 CNY；不是每 1 CNY 对应 7.2 USD。",
              "backLatex": "360\\times\\frac{1}{7.2}=50"
            }
          ]
        }
      ]
    },
    {
      "type": "details",
      "summary": "本页状态与边界",
      "children": [
        {
          "type": "list",
          "items": [
            "预算字段改变会更新指标；本地提交只检查字段，不联网。",
            "记录开关在有记录与全部缺测的空状态间切换，不伪装网络加载。",
            "汇率转换器切换到 GBP 时缺少报价，切回已知币种后可计算。",
            "测验经历未确认、已确认、完成与重来；闪卡可翻面和自评。",
            "全局恢复按钮只恢复文档 state。转换器与学习组件是各自的本地状态，请使用组件自己的重置或重来。"
          ]
        }
      ]
    },
    {
      "type": "button",
      "label": "恢复预算与记录开关初值",
      "action": {
        "kind": "reset"
      }
    },
    {
      "type": "caption",
      "value": "这份首稿未经运行库校验或浏览器预览。显示和交互仍需独立验收。"
    }
  ]
}
  </script>
  <script src="https://cdn.jsdelivr.net/gh/Micraow/Inform-UI@6797f7f7755f483db6c3be3831aa03433b7c4696/cdn/iui.global.min.js" integrity="sha384-tvz7phydYNWyvO3Sz/W+xhrMv0sp+UOlR1p/b3+w9E9M9Hmjff+bGzjaUAglOWd9" crossorigin="anonymous"></script>
  <script>
    const host = document.getElementById('iui');
    try {
      if (!window.IUI) throw new Error('库未加载，请检查网络或 CDN 地址。');
      const { validateDocument, mount } = window.IUI;
      const input = JSON.parse(document.getElementById('iui-spec').textContent);
      const result = validateDocument(input);
      if (!result.ok) throw new Error(result.issues.map(i => `${i.code} ${i.path}: ${i.message}`).join('\n'));
      mount(host, result.document, { styles: false });
    } catch (error) {
      host.textContent = `未能显示界面：${error.message}`;
    }
  </script>
</body>
</html>
