<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>三条虚构步行路线：按时间筛选、按距离比较</title>
<style>body{margin:0;padding:clamp(16px,4vw,40px);font:16px system-ui,sans-serif;color:#171717;background:#fff}main{max-width:960px;margin:auto}#status{max-width:960px;margin:16px auto;white-space:pre-wrap}</style>
</head>
<body>
<main id="answer" aria-label="三条虚构步行路线：按时间筛选、按距离比较"></main>
<p id="status" role="status">正在载入答案…</p>
<noscript>需要启用 JavaScript 才能显示这份互动答案。</noscript>
<script id="inform-config" type="application/json">{"source":"root = Stack([intro,disclaimer,controls,resultSummary,selectionSummary,resultBody,method],\"xl\")\n$maximum = 75\n$direction = \"asc\"\n$chosen = \"\"\nroutes = [{id:\"river\",name:\"河边线\",km:4,minutes:35},{id:\"park\",name:\"公园线\",km:6,minutes:50},{id:\"oldtown\",name:\"古城线\",km:8,minutes:75}]\nvisible = @Sort(@Filter(routes,\"minutes\",\"\u003c=\",$maximum),\"km\",$direction)\nselectedRows = @Filter(visible,\"id\",\"==\",$chosen)\nsavedRows = @Filter(routes,\"id\",\"==\",$chosen)\nselected = @Count(selectedRows)>0 ? @First(selectedRows) : {id:\"\",name:\"\",km:0,minutes:0}\nchartLabels = @Each(visible,\"route\",route.id==selected.id ? route.name+\"（已选）\" : route.name)\nintro = Stack([Heading(\"三条步行路线，哪条适合这次出发？\",1),Text(\"河边线 4 公里、35 分钟；公园线 6 公里、50 分钟；古城线 8 公里、75 分钟。先设定你愿意花的最长时间，再按距离排序，点击按钮选择路线。\")],\"md\")\ndisclaimer = Alert(\"全部为虚构示例\",\"路线名称、距离与时间均来自本题给定的示例数据。时间仅用于演示，不是实际步行预测；没有实时地图、定位、天气或路况数据。\",\"info\")\ncontrols = Card([Slider(\"最长时间（分钟）：仅保留示例时间不超过此值的路线\",$maximum,0,120,5),RadioGroup(\"公里数排序\",$direction,[{label:\"从短到长\",value:\"asc\"},{label:\"从长到短\",value:\"desc\"}]),Row([Button(\"恢复全部并清空选择\",@Reset($maximum,$direction,$chosen),\"secondary\"),Button(\"仅清空选择\",@Reset($chosen),\"ghost\",$chosen==\"\")],\"sm\")],\"筛选与排序\")\nresultSummary = Text(\"最长时间：\"+$maximum+\" 分钟；符合条件：\"+@Count(visible)+\" / \"+@Count(routes)+\" 条；当前按公里数\"+($direction==\"asc\" ? \"从短到长\" : \"从长到短\")+\"排列。\")\nselectionSummary = @Count(selectedRows)>0 ? Alert(\"当前选择：\"+selected.name,\"距离 \"+selected.km+\" 公里，示例时间 \"+selected.minutes+\" 分钟。图表标签、表格和路线按钮均已同步标记。\",\"success\") : @Count(savedRows)>0 ? Alert(\"当前有效选择：无\",\"原选的\"+@First(savedRows.name)+\"不符合当前时间上限，已从结果中隐藏。请选择当前列表中的路线，或放宽时间上限以恢复原选择。\",\"warning\") : Text(\"当前选择：尚未选择。点击下方路线按钮即可选中一条路线。\",\"muted\")\ncomparison = Grid([BarChart(\"符合条件的路线距离（公里）\",chartLabels,[Series(\"公里数\",visible.km)],{height:280,animate:false,legend:false,xAxisLabel:\"路线\",yAxisLabel:\"公里\"}),BarChart(\"符合条件的示例时间（分钟）\",chartLabels,[Series(\"示例时间\",visible.minutes)],{height:280,animate:false,legend:false,xAxisLabel:\"路线\",yAxisLabel:\"分钟\"})],2,\"lg\")\ncomparisonTable = Table([{key:\"name\",label:\"路线\"},{key:\"km\",label:\"距离（公里）\"},{key:\"minutes\",label:\"示例时间（分钟）\"},{key:\"selection\",label:\"选择状态\"}],@Each(visible,\"route\",{name:route.name,km:route.km,minutes:route.minutes,selection:route.id==selected.id ? \"已选\" : \"可选\"}),\"与两个图表相同的筛选结果、排序和选择状态；可直接阅读全部数值。\")\nrouteChoices = Stack(@Each(visible,\"route\",Card([Text(\"距离：\"+route.km+\" 公里；示例时间：\"+route.minutes+\" 分钟。\"),Button(route.id==selected.id ? \"已选择 \"+route.name : \"选择 \"+route.name,@Set($chosen,route.id),route.id==selected.id ? \"secondary\" : \"primary\",route.id==selected.id)],route.name)),\"md\")\nresultBody = @Count(visible)>0 ? Stack([comparison,comparisonTable,Heading(\"点击选择路线\",2),routeChoices],\"lg\") : Alert(\"没有匹配的路线\",\"当前最长时间低于所有路线的示例时间。将上限调到 \"+@Min(routes.minutes)+\" 分钟或以上可显示路线，或点击“恢复全部并清空选择”。\",\"warning\")\nmethod = Stack([Divider(),Text(\"筛选规则：示例时间 ≤ 最长时间，边界包含在内。排序按公里数进行。图表、表格和选择按钮使用同一份筛选与排序结果；选中路线的图表标签会加上“已选”。\",\"muted\"),Text(\"若收紧时间上限使原选择失效，页面会明确提示，且不会自动替你选另一条路线。放宽上限后可恢复仍保存的原选择；清空或重置会取消它。\",\"muted\"),Text(\"来源：用户提供的三条虚构路线。所有筛选与选择仅发生在此页面；真实出行请另行核对路线开放情况、地图、天气和个人步行能力。\",\"muted\")],\"sm\")\n","select":["base/layout","base/text","base/controls","base/icon","base/media","base/charts"],"viewNames":[],"theme":"light"}</script>
<script src="https://cdn.jsdelivr.net/gh/Micraow/Inform-UI@main/cdn/next/inform-ui.global.js"></script>
<script>
(() => {
 const status=document.getElementById('status');
 let failed=false;
 const onError=issues=>{failed=true;status.hidden=false;status.textContent='答案无法显示：'+issues.map(issue=>issue.message||String(issue)).join(' ');};
 try {
  if(!globalThis.InformUI)throw Error('运行库未能载入，请检查网络或 HTML 环境是否允许外部脚本。');
  const config=JSON.parse(document.getElementById('inform-config').textContent);
  const view=InformUI.mount(document.getElementById('answer'),{...config,onError});
  if(view.getSnapshot()&&!failed)status.hidden=true;
  addEventListener('pagehide',()=>view.dispose(),{once:true});
 } catch(error) {onError([{message:error.message}]);}
})();
</script>
</body>
</html>
