name: Bundled runtime contracts
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cdn-main-smoke.yml'
      - 'scripts/check-published-cdn.mjs'
      - 'scripts/publication-evidence.mjs'
      - 'generated/build.json'
      - 'generated/runtime-lock.json'
      - 'profiles/**'
      - 'tests/fixtures/foundation-layered-work.openui'
      - 'examples/repeated-groups.openui'
  workflow_dispatch:
    inputs:
      verify_cdn:
        description: Explicitly verify canonical CDN bytes
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '22'
      - name: Verify canonical CDN bytes without browser execution
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_cdn }}
        run: node scripts/check-published-cdn.mjs --bytes-only
      - name: Verify bundled runtime contracts and profiles
        run: npm run check:contracts && npm run check:profiles
      - name: Test publication evidence and authoring contracts
        run: npm test
