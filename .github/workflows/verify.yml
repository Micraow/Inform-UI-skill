name: Verify skill and library contract

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 22 }
          - { os: ubuntu-latest, node: 24 }
          - { os: windows-latest, node: 22 }
          - { os: macos-latest, node: 22 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: skill
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Read pinned library revision
        id: contract
        working-directory: skill
        shell: bash
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const c=JSON.parse(fs.readFileSync('library-contract.json')); if(c.repository !== 'Micraow/Intelligent-UI' || !/^[a-f0-9]{40}$/.test(c.revision)) throw new Error('Library revision must be a verified commit'); fs.appendFileSync(process.env.GITHUB_OUTPUT, 'revision='+c.revision+'\n');"
      - uses: actions/checkout@v4
        with:
          repository: Micraow/Intelligent-UI
          ref: ${{ steps.contract.outputs.revision }}
          path: library
      - name: Build matched library
        working-directory: library
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npm run build
      - name: Test skill boundaries
        working-directory: skill
        run: |
          npm ci
          npm test
      - name: Verify real API, schema and CLI
        working-directory: skill
        run: npm run check:library -- --library ../library
      - name: Read historical blind library revision
        id: blind-contract
        working-directory: skill
        shell: bash
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const c=JSON.parse(fs.readFileSync('tests/blind/library-contract.json')); if(c.repository !== 'Micraow/Intelligent-UI' || !/^[a-f0-9]{40}$/.test(c.revision)) throw new Error('Invalid historical pin'); fs.appendFileSync(process.env.GITHUB_OUTPUT, 'revision='+c.revision+'\n');"
      - uses: actions/checkout@v4
        with:
          repository: Micraow/Intelligent-UI
          ref: ${{ steps.blind-contract.outputs.revision }}
          path: blind-library
      - name: Build historical blind library
        working-directory: blind-library
        run: |
          npm ci
          npm run build
      - name: Verify immutable blind first output
        working-directory: skill
        run: node scripts/verify-blind.mjs --library ../blind-library
      - name: Read 46-node blind library revision
        id: blind46-contract
        working-directory: skill
        shell: bash
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const c=JSON.parse(fs.readFileSync('tests/blind46/library-contract.json')); if(c.repository !== 'Micraow/Intelligent-UI' || !/^[a-f0-9]{40}$/.test(c.revision)) throw new Error('Invalid 46-node blind pin'); fs.appendFileSync(process.env.GITHUB_OUTPUT, 'revision='+c.revision+'\n');"
      - uses: actions/checkout@v4
        with:
          repository: Micraow/Intelligent-UI
          ref: ${{ steps.blind46-contract.outputs.revision }}
          path: blind46-library
      - name: Build 46-node blind library
        working-directory: blind46-library
        run: |
          npm ci
          npm run build
      - name: Verify immutable 46-node first draft
        working-directory: skill
        run: node scripts/verify-blind46.mjs --library ../blind46-library
      - name: Install browser for fixture regression
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        working-directory: library
        run: npx --no-install playwright install --with-deps chromium
      - name: Verify desktop, mobile and interactive examples
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        working-directory: skill
        run: npm run check:browser -- --library ../library --screenshots artifacts/examples
      - name: Verify original blind HTML with the real CDN
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        working-directory: skill
        run: node scripts/verify-blind.mjs --library ../blind-library --browser --screenshots artifacts/blind
      - name: Verify original 46-node blind HTML with the real CDN
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        working-directory: skill
        run: node scripts/verify-blind46.mjs --library ../blind46-library --browser --screenshots artifacts/blind46
      - name: Save 46-node blind page screenshots and observations
        if: always() && matrix.os == 'ubuntu-latest' && matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: blind46-first-browser
          path: skill/artifacts/blind46
          if-no-files-found: ignore
          retention-days: 7
      - name: Save original blind page screenshots and observations
        if: always() && matrix.os == 'ubuntu-latest' && matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: blind-first-browser
          path: skill/artifacts/blind
          if-no-files-found: ignore
          retention-days: 7
      - name: Save original current fixture screenshots
        if: always() && matrix.os == 'ubuntu-latest' && matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: skill-current-browser
          path: skill/artifacts/examples
          if-no-files-found: ignore
          retention-days: 7
