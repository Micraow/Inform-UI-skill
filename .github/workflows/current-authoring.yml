name: Verify current 219 authoring
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  current-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: skill
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read exact current catalog pin
        id: catalog
        working-directory: skill
        shell: bash
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const c=JSON.parse(fs.readFileSync('authoring/current219/index.json')); if(c.catalogVersion!=='current219'||!/^[a-f0-9]{40}$/.test(c.source.sourceCommit)||c.source.publicCommit!==c.source.sourceCommit) throw Error('Expected verified current catalog'); fs.appendFileSync(process.env.GITHUB_OUTPUT,'revision='+c.source.sourceCommit+'\n');"
      - uses: actions/checkout@v4
        with:
          repository: Micraow/Inform-UI
          ref: ${{ steps.catalog.outputs.revision }}
          path: library-current
      - name: Build matching current runtime
        working-directory: library-current
        run: |
          npm ci
          npm run build
      - name: Test discovery, immutable history and authoring boundaries
        working-directory: skill
        run: node --test --test-concurrency=1 tests/current-authoring.test.mjs tests/progressive-generated.test.mjs tests/thin-entry.test.mjs tests/design-workflows.test.mjs
      - name: Verify actual current CLI
        working-directory: skill
        run: node scripts/verify-current-authoring.mjs --library ../library-current
      - name: Reproduce every source-backed catalog artifact
        working-directory: skill
        run: node --max-old-space-size=1536 scripts/verify-progressive-source.mjs --library ../library-current --revision ${{ steps.catalog.outputs.revision }} --publication authoring/current219/source-public.json --catalog-version current219 --generated authoring/current219
